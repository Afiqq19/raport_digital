name: raport_digital
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.4+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  pdf: ^3.11.3
  printing: ^5.14.2
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Alat bantu generate icon & splash
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  
  # Linter dipindahkan ke sini (tempat yang benar)
  flutter_lints: ^5.0.0

# --- KONFIGURASI ICON APLIKASI ---
flutter_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo_smk.jpg"
  min_sdk_android: 21

# --- KONFIGURASI SPLASH SCREEN ---
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/logo_smk.jpg"
  android_12:
    image: "assets/images/logo_smk.jpg"
    color: "#FFFFFF"

# --- KONFIGURASI FLUTTER & ASSETS ---
flutter:
  uses-material-design: true

  assets:
    - assets/images/